name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check code hash is unchanged
        run: node -e "const h=require('./build/xmss_wallet.compiled.json').hash; if(h!=='4f6ce7bea9b50089fad7736b0fe5d10f54b136ebcc412254e376e2db825338ac'){console.error('code hash changed: '+h+' — update docs and EXPECTED_CODE_HASH');process.exit(1)}"
      - run: npm test
